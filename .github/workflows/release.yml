name: Build and publish Alaa Player 2

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      version_name:
        description: 'الإصدار الظاهر للمستخدم، مثل 1.1 أو 1.2 أو 2.4'
        required: true
        type: string
      device_control_api_base_url:
        description: 'عنوان لوحة تحكم Alaa المنشورة، مثل https://control.example.com (اختياري)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: alaa-player-2-release-master
  cancel-in-progress: false

jobs:
  metadata:
    name: Determine release version
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.app_version.outputs.version_name }}
      version_code: ${{ steps.app_version.outputs.version_code }}
      release_tag: ${{ steps.app_version.outputs.release_tag }}
      apk_name: ${{ steps.app_version.outputs.apk_name }}
      device_control_api_base_url: ${{ steps.app_version.outputs.device_control_api_base_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: app_version
        shell: bash
        env:
          MANUAL_VERSION_NAME: ${{ inputs.version_name }}
          MANUAL_DEVICE_CONTROL_API_BASE_URL: ${{ inputs.device_control_api_base_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          # Find the latest automatically generated version code.
          LATEST_VERSION_CODE="$(
            git tag -l 'v*+*' |
            sed -nE 's/^v[0-9]+(\.[0-9]+){1,2}\+([0-9]+)$/\2/p' |
            sort -n |
            tail -1
          )"

          VERSION_CODE="$(( ${LATEST_VERSION_CODE:-1000} + 1 ))"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION_NAME="$MANUAL_VERSION_NAME"

            if ! [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
              echo "version_name must use a simple semantic format such as 1.1, 1.2, or 2.4.1."
              exit 1
            fi

            DEVICE_CONTROL_API_BASE_URL="$MANUAL_DEVICE_CONTROL_API_BASE_URL"
          else
            # Automatic release:
            # 1001 -> 1.1
            # 1002 -> 1.2
            # 1003 -> 1.3
            #
            # This means every push to master gets its own release version.
            RELEASE_NUMBER="$(( VERSION_CODE - 1000 ))"
            VERSION_NAME="1.${RELEASE_NUMBER}"
            DEVICE_CONTROL_API_BASE_URL=""
          fi

          RELEASE_TAG="v${VERSION_NAME}+${VERSION_CODE}"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} already exists."
            exit 1
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=Alaa-Player-2.apk" >> "$GITHUB_OUTPUT"
          echo "device_control_api_base_url=${DEVICE_CONTROL_API_BASE_URL}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "========================================"
          echo " Automatic Alaa Player 2 Release"
          echo "========================================"
          echo "Event: ${EVENT_NAME}"
          echo "Version name: ${VERSION_NAME}"
          echo "Version code: ${VERSION_CODE}"
          echo "Release tag: ${RELEASE_TAG}"
          echo "========================================"

  build:
    name: Build signed APK
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare required signing files
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for required in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD
          do
            if [ -z "${!required}" ]; then
              echo "Missing required signing secret: ${required}"
              exit 1
            fi
          done

          mkdir -p keystore

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

          printf '%s\n' \
            'storeFile=keystore/release.jks' \
            "storePassword=$RELEASE_STORE_PASSWORD" \
            "keyAlias=$RELEASE_KEY_ALIAS" \
            "keyPassword=$RELEASE_KEY_PASSWORD" \
            > keystore.properties

      - name: Build signed release APK
        run: |
          chmod +x gradlew

          ./gradlew \
            --console=plain \
            --max-workers=1 \
            :app:assembleRelease \
            -PreleaseMinify=false \
            -PappVersionCode=${{ needs.metadata.outputs.version_code }} \
            -PappVersionName=${{ needs.metadata.outputs.version_name }} \
            -PdeviceControlApiBaseUrl='${{ needs.metadata.outputs.device_control_api_base_url }}'

      - name: Verify and prepare release artifact
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK_PATH" ]; then
            echo "No release APK produced."
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          mkdir -p dist

          cp "$APK_PATH" "dist/${{ needs.metadata.outputs.apk_name }}"

          SHA256="$(
            sha256sum "dist/${{ needs.metadata.outputs.apk_name }}" |
            awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "$SHA256" \
            "${{ needs.metadata.outputs.apk_name }}" \
            > "dist/${{ needs.metadata.outputs.apk_name }}.sha256"

          echo ""
          echo "Release APK:"
          ls -lh "dist/${{ needs.metadata.outputs.apk_name }}"

          echo ""
          echo "SHA256:"
          cat "dist/${{ needs.metadata.outputs.apk_name }}.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            dist/${{ needs.metadata.outputs.apk_name }}
            dist/${{ needs.metadata.outputs.apk_name }}.sha256

  quality:
    name: Run quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test CI helper scripts
        shell: bash
        run: |
          chmod +x gradlew

          for test_script in tools/tests/*-test.sh; do
            bash "$test_script"
          done

      - name: Run unit tests, lint, and coverage
        run: |
          ./gradlew \
            --console=plain \
            testDebugUnitTest \
            :app:lintDebug \
            :data:lintDebug \
            :player:lintDebug \
            verifyLintBaseline \
            koverXmlReportCi \
            koverHtmlReportCi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            data/build/reports/tests/
            domain/build/reports/tests/
            player/build/reports/tests/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/reports/kover/

  instrumentation:
    name: Compile instrumentation release gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile instrumentation release gates
        run: |
          chmod +x gradlew

          ./gradlew \
            --console=plain \
            :app:assembleDebugAndroidTest \
            :data:assembleDebugAndroidTest

  release-tv-smoke:
    name: Android TV release smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android TV release smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          profile: tv_1080p
          script: |
            chmod +x gradlew tools/run-platform-smoke.sh tools/wait-for-emulator.sh

            ./tools/run-platform-smoke.sh "35" "x86_64"

      - name: Upload Android TV smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tv-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/platform-smoke-diagnostics/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            data/build/outputs/androidTest-results/
            data/build/reports/androidTests/

  publish-release:
    name: Publish GitHub release

    # The signed APK job already verifies its signature before artifact upload.
    # Quality, instrumentation, and TV smoke remain visible but do not block
    # publication of the installable signed release APK.
    needs: [metadata, build]

    runs-on: ubuntu-latest

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Alaa Player 2 ${{ needs.metadata.outputs.version_name }}

          body: |
            ## Alaa Player 2 ${{ needs.metadata.outputs.version_name }}

            إصدار رسمي تم بناؤه تلقائيًا من فرع `master`.

            | البند | القيمة |
            | --- | --- |
            | رمز الإصدار | `${{ needs.metadata.outputs.version_code }}` |
            | الالتزام | `${{ github.sha }}` |
            | اسم الحزمة | `com.alaaaya.alaaplayer2` |

            تم بناء هذا الإصدار كـ Release APK موقّع باستخدام مفتاح الإصدار الرسمي.

            نزّل ملف `Alaa-Player-2.apk` وثبّته من شاشة Android.

            تُثبَّت النسخة الجديدة فوق النسخة الرسمية السابقة وتحافظ على بيانات التطبيق ما دام معرّف الحزمة ومفتاح التوقيع ثابتين.

            Alaa Player 2 مشتق من [StreamVault](https://github.com/Davidona/StreamVault-IPTV) للمطور David Nashash (Davidona)، ويخضع لترخيص StreamVault Source-Available License (Non-Commercial). استخدم فقط المصادر التي تملك حق الوصول إليها.

          files: |
            dist/${{ needs.metadata.outputs.apk_name }}
            dist/${{ needs.metadata.outputs.apk_name }}.sha256

          make_latest: true
          generate_release_notes: false