name: Build Alaa Player 2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --console=plain '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --max-workers=1 :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/Alaa-Player-2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alaa-player-2-debug-apk
          path: dist/Alaa-Player-2-debug.apk
          if-no-files-found: error
          retention-days: 7
