name: Updater screenshots
on:
  push:
    branches: [kat/updater-screenshot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Render production updater in Arabic at 1920x1080
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' --max-workers=1 :app:testDebugUnitTest --tests com.streamvault.app.shots.UpdaterShotsTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-ar-tv-screenshots
          path: |
            app/build/outputs/updater-shots/*.png
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
